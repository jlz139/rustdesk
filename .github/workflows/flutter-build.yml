# 文件位置：.github/workflows/manual-build.yml
name: Flutter Manual Build

on:
  workflow_dispatch:
    inputs:
      build-mode:
        description: 'Build mode (debug/release)'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        # 🔥 关键配置：所有命令在项目根目录执行
        working-directory: ${{ github.workspace }}/your_project_dir

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: your_project_dir  # ⚠️ 必须与 working-directory 的子目录名一致

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Validate Project
        run: |
          pwd
          ls -la pubspec.yaml  # ✅ 确认文件存在
          flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows App
        run: flutter build windows --${{ inputs.build-mode }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ inputs.build-mode }}-build
          path: |
            your_project_dir/build/windows/runner/*/*.exe
            your_project_dir/build/windows/**/*.dll
