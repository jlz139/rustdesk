# .github/workflows/1-flutter-manual-build.yml
name: "1. Flutter手动构建"  # 按需调整数字前缀

# 🔥 手动触发配置
on:
  workflow_dispatch:  # 允许手动触发
    inputs:
      build-mode:
        description: '构建模式 (debug/release)'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release
      upload-tag:
        description: '上传标签'
        required: false
        default: 'latest'
        type: string

jobs:
  manual-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}/your_project_dir  # 项目真实路径

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          path: your_project_dir  # 代码检出到子目录

      - name: 设置Flutter环境
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 验证项目结构
        run: |
          cd your_project_dir
          ls -la
          flutter doctor -v

      - name: 获取依赖
        run: flutter pub get

      - name: 构建Windows程序
        run: flutter build windows --${{ inputs.build-mode }}
      
      - name: 上传制品
        if: ${{ inputs.upload-tag != '' }}
        uses: actions/upload-artifact@v3
        with:
          name: windows-build-${{ inputs.build-mode }}
          path: your_project_dir/build/windows/x64/runner/${{ inputs.build-mode }}/*
          retention-days: 7
