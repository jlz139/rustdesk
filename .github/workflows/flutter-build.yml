name: Flutter Windows Build

on:
  workflow_dispatch:
    inputs:
      build-mode:
        description: '构建模式 (debug/release)'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release
      upload-tag:
        description: '上传标签'
        required: false
        default: 'latest'
        type: string

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Flutter环境
        uses: subosito/flutter-action@v2

      - name: 构建应用
        run: flutter build windows --${{ inputs.build-mode }}

      - name: 上传制品
        uses: actions/upload-artifact@v4  # 关键修复点
        with:
          name: windows-build-${{ inputs.build-mode }}
          path: build/windows/x64/runner/${{ inputs.build-mode }}/*.exe
