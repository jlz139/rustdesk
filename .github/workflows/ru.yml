name: Windows Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: full
  RUSTFLAGS: "-C target-feature=+crt-static"

jobs:
  build-controlled:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Chocolatey Packages
        shell: pwsh
        run: |
          # 安装必要的 Visual Studio 组件
          choco install -y visualstudio2022buildtools --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended"
          choco install -y dotnetfx
          
          # 显式调用刷新环境变量（兼容性处理）
          $env:Path = [System.Environment]::GetEnvironmentVariable('Path','Machine') + ";" + [System.Environment]::GetEnvironmentVariable('Path','User')
          Write-Host "##vso[task.prependpath]C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Tools\MSVC\bin\Hostx64\x64"

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
          override: true

      - name: Build Project
        shell: pwsh
        run: |
          # 创建输出目录
          New-Item -ItemType Directory -Path "bins" -Force | Out-Null
          
          # 构建命令（添加详细日志）
          cargo build --verbose --bin controlled --features controlled --release --target x86_64-pc-windows-msvc
          
          # 文件复制与验证
          $exePath = "target/x86_64-pc-windows-msvc/release/controlled.exe"
          if (Test-Path $exePath) {
              Copy-Item $exePath -Destination "bins/controlled.exe"
          } else {
              Write-Error "构建产物未找到: $exePath"
              exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: controlled-bin
          path: bins/controlled.exe
