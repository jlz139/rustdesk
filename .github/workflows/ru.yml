name: Build with VS 2022

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest  # 必须使用 Windows 环境

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        submodules: recursive  # 确保拉取子模块

    # 安装 Chocolatey（如尚未安装）
    - name: Install Chocolatey
      shell: powershell
      run: |
        Set-ExecutionPolicy Bypass -Scope Process -Force
        [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
        iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))

    # 安装必要组件
    - name: Install VS 2022 Build Tools
      shell: powershell
      run: |
        choco install -y visualstudio2022buildtools --package-parameters="--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended"
        choco install -y dotnetfx

    # 刷新环境变量
    - name: Update environment variables
      shell: powershell
      run: |
        Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
        Update-SessionEnvironment
        # 显式添加 MSVC 路径到 PATH
        $msvcPath = "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Tools\MSVC\bin\Hostx64\x64"
        echo "PATH=$env:PATH;$msvcPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    # 验证路径和编译器
    - name: Verify MSVC tools
      shell: powershell
      run: |
        # 检查 cl.exe 是否存在
        if (Test-Path "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Tools\MSVC\bin\Hostx64\x64\cl.exe") {
          Write-Host "MSVC cl.exe 路径验证成功"
        } else {
          Write-Error "MSVC cl.exe 未找到"
          exit 1
        }
        # 打印编译器版本
        cl.exe /?
