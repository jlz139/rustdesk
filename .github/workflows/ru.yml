name: Windows Build

on:
  # 手动触发配置
  workflow_dispatch:
    inputs:
      build-version:
        description: '输入构建版本号 (例如 1.2.3)'
        required: true
        default: '1.0.0'
      build-arch:
        description: '选择目标架构'
        required: true
        default: 'x64'
        type: choice
        options:
          - x86
          - x64

env:
  SOLUTION_PATH: WindowInjection/WindowInjection.vcxproj

jobs:
  build-windows-dll:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    # 手动触发参数接收
    - name: Parse inputs
      run: |
        echo "BUILD_VERSION=${{ github.event.inputs.build-version }}" >> $env:GITHUB_ENV
        echo "BUILD_ARCH=${{ github.event.inputs.build-arch }}" >> $env:GITHUB_ENV

    # 代码检出
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        repository: rustdesk-org/RustDeskTempTopMostWindow
        path: src
        ref: main

    # 版本注入
    - name: Inject version info
      shell: powershell
      run: |
        $versionFile = "src/version.props"
        $content = @"
        <Project>
          <PropertyGroup>
            <Version>$env:BUILD_VERSION</Version>
            <Platform>$env:BUILD_ARCH</Platform>
          </PropertyGroup>
        </Project>
        "@
        Set-Content -Path $versionFile -Value $content
        Get-Content $versionFile

    # 构建流程
    - name: Build with MSBuild
      uses: microsoft/setup-msbuild@v2
      with:
        vs-version: '2022'

    - name: Run MSBuild
      shell: powershell
      run: |
        msbuild $env:SolutionPath `
          /p:Configuration=Release `
          /p:Platform=$env:BUILD_ARCH `
          /p:WindowsTargetPlatformVersion=10.0 `
          /p:AppxPackageSigningEnabled=false
      working-directory: ./src

    # 产物处理
    - name: Archive output
      uses: actions/upload-artifact@v4
      with:
        name: rustdesk-dll-${{ env.BUILD_ARCH }}-${{ env.BUILD_VERSION }}
        path: |
          src/WindowInjection/${{ env.BUILD_ARCH }}/Release/*.dll
          src/WindowInjection/${{ env.BUILD_ARCH }}/Release/*.pdb
        retention-days: 7
