name: Windows Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: full
  RUSTFLAGS: "-C target-feature=+crt-static"

jobs:
  build-controlled:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive  # 关键修复1：递归初始化子模块

      - name: Install Build Tools
        shell: pwsh
        run: |
          choco install -y visualstudio2022buildtools --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended"
          refreshenv
          Write-Host "##vso[task.prependpath]C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Tools\MSVC\bin\Hostx64\x64"

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
          override: true
          components: rustc, rust-std, cargo, clippy, rustfmt  # 关键修复2：明确组件

      - name: Build Project
        shell: pwsh
        run: |
          # 验证子模块存在性
          if (-not (Test-Path "libs/hbb_common/Cargo.toml")) {
              Write-Error "关键依赖缺失: libs/hbb_common/Cargo.toml 不存在"
              exit 1
          }

          # 带详细日志的构建
          cargo build --verbose --bin controlled --features controlled --release --target x86_64-pc-windows-msvc
          
          # 产物路径处理
          $exePath = "target/x86_64-pc-windows-msvc/release/controlled.exe"
          if (Test-Path $exePath) {
              New-Item -ItemType Directory -Path "bins" -Force | Out-Null
              Copy-Item $exePath -Destination "bins/controlled.exe"
          } else {
              Get-ChildItem -Recurse target  # 调试：列出构建目录
              Write-Error "构建失败：产物未生成"
              exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: controlled-bin
          path: bins/controlled.exe
