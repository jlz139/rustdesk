name: Build with Dynamic Toolset

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install VS 2022 Components
      shell: powershell
      run: |
        # 安装最新 MSVC 工具集
        choco install -y visualstudio2022-workload-vctools --force

    - name: Auto-detect Toolset Version
      id: detect-toolset
      shell: powershell
      run: |
        $vsPath = & "${env:ProgramFiles}\Microsoft Visual Studio\Installer\vswhere.exe" `
          -latest `
          -products * `
          -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
          -property installationPath
        
        $toolsetVersion = Get-ChildItem "$vsPath\VC\Tools\MSVC" -Directory `
          | Sort-Object Name -Descending `
          | Select-Object -First 1
        
        echo "TOOLSET_VERSION=$($toolsetVersion.Name)" >> $env:GITHUB_OUTPUT

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
        toolset: ${{ steps.detect-toolset.outputs.TOOLSET_VERSION }}
