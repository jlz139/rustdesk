name: Windows DLL Build

on:
  workflow_dispatch:
    inputs:
      build-arch:
        description: 'Target Architecture'
        required: true
        default: 'x64'
        type: choice
        options: [ x64, x86 ]

env:
  VS_INSTALL_DIR: 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise'

jobs:
  build-dll:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        repository: rustdesk-org/RustDeskTempTopMostWindow
        path: src
        ref: main

    # 关键修复步骤：安装必要组件
    - name: Install VS Build Tools
      shell: powershell
      run: |
        choco install -y visualstudio2022-workload-vctools `
          --package-parameters="--add Microsoft.VisualStudio.Component.VC.Tools.x86.x64" `
          --no-progress
        refreshenv

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
      with:
        vs-version: 2022
        architecture: ${{ github.event.inputs.build-arch }}

    - name: Verify MSBuild
      run: msbuild -version
      shell: cmd

    - name: Build Solution
      run: |
        msbuild src/WindowInjection/WindowInjection.vcxproj `
          /p:Configuration=Release `
          /p:Platform=${{ github.event.inputs.build-arch }} `
          /p:WindowsTargetPlatformVersion=10.0 `
          /p:AppxPackageSigningEnabled=false
      shell: cmd

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dll-output-${{ github.event.inputs.build-arch }}
        path: |
          src/WindowInjection/${{ github.event.inputs.build-arch }}/Release/*.dll
          src/WindowInjection/${{ github.event.inputs.build-arch }}/Release/*.pdb
